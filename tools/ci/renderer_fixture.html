<!doctype html>
<html lang="en" data-fixture="pommerman-renderer">
<head>
<meta charset="utf-8">
<title>pommerman worst-case renderer fixture</title>
<style>
  html, body { margin: 0; height: 100%; background: #120d09; color: #f2e8d8;
    font: 12px system-ui; overflow: hidden; }
  #host { position: absolute; inset: 0 264px 24px 0; }
  iframe { border: 0; display: block; }
  #boardhost { position: absolute; top: 0; right: 0; width: 256px;
    padding: 4px; }
  #boardhost canvas { width: 248px; height: 248px; display: block;
    background: #0b0704; }
  #boardhost div { font: 10px system-ui; padding: 2px 0; }
  #report { position: absolute; left: 0; right: 0; bottom: 0; height: 24px;
    line-height: 24px; padding: 0 8px; white-space: nowrap;
    overflow: hidden; background: #0b0704; }
</style>
</head>
<body>
<div id="host"></div>
<div id="boardhost"><canvas id="fixture-board"></canvas><div id="boardnote">
canvas: booting</div></div>
<div id="report">fixture: booting</div>
<!-- The shipped renderer and its wire constants, run on a canvas THIS
     document owns. See "THE CANVAS HALF" below. -->
<script src="./wire_constants.js"></script>
<script src="./broadcast_core.js"></script>
<script>
/*
 * The worst-case TEXT fixture.
 *
 * tools/ci/docker_smoke.sh runs with NO ANTHROPIC_API_KEY, so every seat in the
 * CI replay plays the scripted baseline and a scripted seat emits no `say` at
 * all -- the smoke replay can never exercise the feed's text path
 * (cogchemists, 2026-08-24). This page therefore LOADS THE SHIPPED
 * dist/static-replay-viewer/index.html in an iframe, waits for its own
 * data-replay-loaded, and then drives THAT PAGE'S OWN feed and scorebug with a
 * full-cap 100-rune seat line on all FOUR seats at canvas widths 360, 640 and
 * 1280 px. It does not re-implement any drawing (the particle-worlds
 * 2026-08-26 scar): every string it checks was laid out by the real chrome.
 *
 * THE CANVAS HALF. The shipped page hands #board to a Worker with
 * transferControlToOffscreen (replay-viewer/static_replay.js), so every
 * fillText the BOARD makes happens off the main thread and the measurer
 * viewer_smoke.mjs patches onto CanvasRenderingContext2D.prototype in each
 * frame never sees it: `canvas_text: {total: 0}`, which the acceptance
 * checklist (item 15) calls "not evidence of anything". So the fixture also
 * runs the SAME client/broadcast_core.js -- the file the Worker imports -- on
 * a canvas THIS document owns, at the same three widths, and hands it a frame
 * built to hurt: bombers on the top and bottom rows (where the radio badge has
 * no room above the chip and must flip below it) and bombs in all four corners
 * with the whole fuse ladder. Nothing is re-implemented; the draw calls are
 * the shipped renderer's, on the main thread, where they can be measured.
 *
 * It fails by setting data-replay-error, which viewer_smoke.mjs reads and fails
 * fast on; it passes by setting data-replay-loaded="true" on its own <html>.
 */
(function () {
  'use strict';

  // 360 is the featured-match embed, 640 is the .tiny boundary relayout()
  // toggles at, 1280 is desktop.
  var WIDTHS = [360, 640, 1280];
  // 100 runes exactly -- MaxSayRunes. The padding is U+00B7 MIDDLE DOT, never
  // an ellipsis, so a string that was silently shortened cannot be mistaken for
  // one that was deliberately elided (the fog-of-war-boards 2026-08-27 scar).
  // Two 4-byte emoji sit ON the cap so a byte truncation anywhere on the path
  // shows up as mojibake rather than passing quietly.
  var CAP_SAY = (function () {
    var body = 'boxing him against the SE lattice, partner take the north lane ';
    var runes = Array.from(body);
    while (runes.length < 98) runes.push('\u00b7');
    runes.length = 98;
    return runes.join('') + '\u{1F6E1}\u{1F525}';
  })();
  var CAP_SAY_RUNES = 100;
  var LONG_NAME = 'pommerman-firestarter-with-a-very-long-policy-name';

  function fail(message) {
    document.documentElement.setAttribute('data-replay-error', message);
    document.getElementById('report').textContent = 'fixture FAILED: ' + message;
    throw new Error(message);
  }

  // THE FIXTURE'S OWN STRINGS ARE UNDER TEST TOO. One quietly shortened remark
  // leaves everything below passing while testing nothing, so the worst case is
  // asserted to still BE the worst case before it is ever rendered: full cap,
  // in runes, ending on the two 4-byte emoji.
  if (Array.from(CAP_SAY).length !== CAP_SAY_RUNES) {
    fail('the fixture\'s own seat line is ' +
      Array.from(CAP_SAY).length + ' runes, not the ' + CAP_SAY_RUNES +
      '-rune cap it is supposed to drive');
  }
  if (!/\u{1F6E1}\u{1F525}$/u.test(CAP_SAY)) {
    fail('the fixture\'s seat line no longer ends on the cap-straddling ' +
      'emoji pair');
  }
  if (CAP_SAY.indexOf('\u2026') >= 0) {
    fail('the fixture pads with an ellipsis, so a truncated string would be ' +
      'indistinguishable from the intended one');
  }
  if (LONG_NAME.length < 40) {
    fail('the fixture\'s policy name is too short to crowd a 360px plate');
  }

  // ---- the measurer -------------------------------------------------------
  // The fixture measures every fillText/strokeText this document draws itself,
  // rather than trusting the harness to: run outside viewer_smoke.mjs it must
  // still be able to say "nothing was drawn" out loud. The patch sits ON TOP of
  // the one viewer_smoke.mjs installs in its init script (both wrap the same
  // prototype, ours calls through), so one draw is counted by both and the
  // harness's --strict-text-bounds gate reads the same numbers this page does.
  var TOL = 1;
  var drawn = { total: 0, outside: 0, ellipsized: 0, strings: {} };
  function tally(ctx, text, x, y) {
    drawn.total += 1;
    if (/\u2026\s*$/.test(text)) drawn.ellipsized += 1;
    var canvas = ctx.canvas;
    if (!canvas || !canvas.width || !canvas.height) return;
    var m = ctx.measureText(text);
    var align = ctx.textAlign;
    var left = x;
    if (align === 'center') left = x - m.width / 2;
    else if (align === 'right' || align === 'end') left = x - m.width;
    var right = left + m.width;
    var top = y - (isFinite(m.actualBoundingBoxAscent) ? m.actualBoundingBoxAscent : 0);
    var bottom = y + (isFinite(m.actualBoundingBoxDescent) ? m.actualBoundingBoxDescent : 0);
    var edges = [];
    if (top < -TOL) edges.push('top');
    if (left < -TOL) edges.push('left');
    if (bottom > canvas.height + TOL) edges.push('bottom');
    if (right > canvas.width + TOL) edges.push('right');
    var entry = drawn.strings[text] ||
      (drawn.strings[text] = { inside: 0, outside: 0, edges: '', box: null,
        canvas: null });
    if (edges.length) {
      drawn.outside += 1;
      entry.outside += 1;
      entry.edges = edges.join('+');
      entry.box = [Math.round(left), Math.round(top), Math.round(right),
        Math.round(bottom)];
      entry.canvas = [canvas.width, canvas.height];
    } else {
      entry.inside += 1;
    }
  }
  (function installMeasurer() {
    var proto = window.CanvasRenderingContext2D &&
      window.CanvasRenderingContext2D.prototype;
    if (!proto) fail('this browser has no CanvasRenderingContext2D to measure');
    ['fillText', 'strokeText'].forEach(function (name) {
      var real = proto[name];
      if (typeof real !== 'function') return;
      proto[name] = function (text, x, y) {
        var out = real.apply(this, arguments);
        try { tally(this, String(text), x, y); } catch (ignored) { /* keep drawing */ }
        return out;
      };
    });
  })();

  function neverInside() {
    var never = [];
    for (var text in drawn.strings) {
      if (!Object.prototype.hasOwnProperty.call(drawn.strings, text)) continue;
      var entry = drawn.strings[text];
      if (entry.outside > 0 && entry.inside === 0) {
        never.push({ text: text, edges: entry.edges, box: entry.box,
          canvas: entry.canvas, draws: entry.outside });
      }
    }
    return never;
  }

  // The merged report the harness reads. viewer_smoke.mjs evaluates
  // `window.__coworldTextBounds.report()` in the TOP frame only, and each frame
  // gets its own tally from the init script, so the iframe's numbers are folded
  // in here rather than being lost.
  function publishMergedBounds() {
    var outer = window.__coworldTextBounds;
    if (!outer || typeof outer.report !== 'function') return;
    var innerOf = function () {
      try {
        var w = iframe.contentWindow;
        var t = w && w.__coworldTextBounds;
        return (t && typeof t.report === 'function') ? t.report() : null;
      } catch (error) { return null; }
    };
    window.__coworldTextBounds = {
      report: function () {
        var a = outer.report();
        var b = innerOf();
        if (!b) return a;
        return {
          total: a.total + b.total,
          outside: a.outside + b.outside,
          ellipsized: a.ellipsized + b.ellipsized,
          never_inside: a.never_inside + b.never_inside,
          never_inside_samples: a.never_inside_samples
            .concat(b.never_inside_samples).slice(0, 12),
          distinct_capped: a.distinct_capped || b.distinct_capped,
          samples: a.samples.concat(b.samples).slice(0, 12)
        };
      }
    };
  }

  function replayUrl() {
    var fromQuery = null;
    try {
      fromQuery = new URLSearchParams(location.search).get('replay');
    } catch (error) { /* no query */ }
    return fromQuery || './episode.replay';
  }

  var ALIASES = ['RED-1', 'BLUE-1', 'RED-2', 'BLUE-2'];
  var TEAMS = ['red', 'blue', 'red', 'blue'];

  function synthetic(base, width) {
    // The real page's own state shape, with the worst-case strings written in.
    var s = JSON.parse(JSON.stringify(base));
    s.pm.seats = [];
    for (var i = 0; i < 4; i++) {
      s.pm.seats.push({
        slot: i, alias: ALIASES[i], name: LONG_NAME + '-' + i,
        team: TEAMS[i], alive: i !== 3, ammo: 2, range: 3, kick: i === 0,
        kills: 1, bombs: 14, wood: 12, radio: [3, 7],
        fallbacks: i === 1 ? 1 : 0, kind: 'llm'
      });
    }
    s.teams = {
      red: { lives: 2, alive: 2, kills: 2, wood: 21, score: 141,
             policies: [LONG_NAME + '-0', LONG_NAME + '-2'],
             aliases: ['RED-1', 'RED-2'], radio: [3, 7], fallback: false },
      blue: { lives: 1, alive: 1, kills: 0, wood: 20, score: -141,
              policies: [LONG_NAME + '-1', LONG_NAME + '-3'],
              aliases: ['BLUE-1', 'BLUE-2'], radio: [1, 1], fallback: true }
    };
    // The feed keeps only its newest few rows and pushFeed inserts at the TOP,
    // so the worst-case seat lines go LAST: they are the strings under test and
    // they must survive the trim.
    s.pm.events = [
      { k: 'order', seat: 0, verb: 'hunt', arg: 'BLUE-1' },
      { k: 'radio', seat: 0, team: 'red', a: 3, b: 7 },
      { k: 'kick', seat: 0, x: 4, y: 6, dir: 'left' },
      { k: 'fallback', seat: 1, cause: 'timeout' },
      { k: 'collapse', ring: 1, tick: 96 },
      { k: 'firstblood', killer: 0, victim: 3 },
      { k: 'say', seat: 3, text: CAP_SAY },
      { k: 'say', seat: 2, text: CAP_SAY },
      { k: 'say', seat: 1, text: CAP_SAY },
      { k: 'say', seat: 0, text: CAP_SAY }
    ];
    s.width = width;
    return s;
  }

  // ---- the canvas half ----------------------------------------------------
  // The same state object, with the board contents that make the RENDERER draw
  // text where there may be no room: a bomber on the top row (its radio badge
  // wants the space above the chip, which does not exist, so drawRadioGlyphs
  // must flip it below) and one on the bottom row, plus a bomb in each corner
  // and the whole fuse ladder, since the fuse numeral is centred in its cell
  // and the corner cells are the ones that can spill off the board.
  var BOMBER_CELLS = [[1, 0], [9, 0], [1, 10], [9, 10]];
  var BOMB_CELLS = [[0, 0], [10, 0], [0, 10], [10, 10], [5, 5], [3, 7], [7, 3]];
  var FUSES = [8, 6, 4, 2, 1, 0, 3];

  function canvasFrame(base, width) {
    var s = synthetic(base, width);
    var widthIndex = WIDTHS.indexOf(width);
    s.pm.bombers = [];
    for (var i = 0; i < 4; i++) {
      s.pm.bombers.push({
        seat: i, alias: ALIASES[i], team: TEAMS[i],
        x: BOMBER_CELLS[i][0], y: BOMBER_CELLS[i][1],
        alive: true, ammo: 3, range: 4, kick: true,
        // A DISTINCT pair per (width, seat), because viewer_smoke.mjs's
        // never_inside gate is per drawn STRING: were all four badges the same
        // string, one that landed inside at 1280 px would mask the same string
        // landing off-frame at 360 px and the gate would read 0 while the
        // embed was broken.
        radio: [1 + widthIndex, 1 + i], radioAge: 1,
        skin: i < 2 ? 'plain' : 'crown',
        fallback: i === 1
      });
    }
    s.pm.bombs = [];
    for (var b = 0; b < BOMB_CELLS.length; b++) {
      s.pm.bombs.push({
        id: b, x: BOMB_CELLS[b][0], y: BOMB_CELLS[b][1], fuse: FUSES[b],
        range: 4, seat: b % 4, team: TEAMS[b % 4],
        moving: b === 0 ? 'right' : 'none', blast: []
      });
    }
    return s;
  }

  var board = document.getElementById('fixture-board');
  var boardNote = document.getElementById('boardnote');
  var core = null;
  function ensureCore() {
    if (core) return core;
    if (!window.BroadcastCore || typeof window.BroadcastCore.create !== 'function') {
      fail('broadcast_core.js did not publish window.BroadcastCore -- the ' +
        'fixture cannot drive the real renderer');
    }
    core = window.BroadcastCore.create({
      canvas: board,
      websocket: false,
      playoutBuffer: false,
      viewportWidth: WIDTHS[0],
      viewportHeight: WIDTHS[0],
      devicePixelRatio: 1,
      onText: function () {},
      onStatus: function () {},
      onFirstFrame: function () {},
      onTransform: function () {}
    });
    // start() is deliberately not called: it kicks off an asset fetch against
    // the NATIVE page's `<prefix>/client/` art path, which does not exist next
    // to the bundle, and an rAF loop this page does not need. ingest() draws
    // synchronously through the same draw() every Worker frame goes through,
    // which is the code under test here.
    return core;
  }

  function driveCanvas(base, width) {
    var c = ensureCore();
    var before = drawn.total;
    c.setViewportSize(width, width, 1);
    c.ingest(JSON.stringify(canvasFrame(base, width)));
    if (board.width !== width || board.height !== width) {
      fail('the fixture canvas is ' + board.width + 'x' + board.height +
        ' where the renderer was asked for ' + width + 'px');
    }
    if (drawn.total <= before) {
      fail('the real renderer drew no text at ' + width + 'px -- the ' +
        'canvas_text gate would be measuring nothing');
    }
    return drawn.total - before;
  }

  var host = document.getElementById('host');
  var report = document.getElementById('report');
  var iframe = document.createElement('iframe');
  iframe.src = './index.html?replay=' + encodeURIComponent(replayUrl());
  iframe.width = WIDTHS[0];
  iframe.height = Math.round(WIDTHS[0] * 1.35);
  host.appendChild(iframe);

  var deadline = Date.now() + 60000;
  var checks = [];

  function ready() {
    try {
      var doc = iframe.contentDocument;
      return !!doc &&
        doc.documentElement.getAttribute('data-replay-loaded') === 'true';
    } catch (error) {
      return false;
    }
  }

  function driveWidth(index, done) {
    if (index >= WIDTHS.length) { done(); return; }
    var width = WIDTHS[index];
    iframe.width = width;
    iframe.height = Math.round(width * 1.35);
    setTimeout(function () {
      var w = iframe.contentWindow;
      var doc = iframe.contentDocument;
      if (!w.PommermanChrome || !w.POMMERMAN_CTX) {
        fail('the shipped page exposes no PommermanChrome/POMMERMAN_CTX to drive');
      }
      var base = w.POMMERMAN_CTX.getState();
      if (!base || !base.pm) fail('the shipped page has no state frame yet');
      var s = synthetic(base, width);
      w.PommermanChrome.frame(s, w.POMMERMAN_CTX, false);

      // What can actually go wrong with DOM text: a row clipped to nothing, or
      // a name collapsed to a bare ellipsis. Both are measured on the REAL
      // laid-out nodes.
      var feed = doc.getElementById('killfeed');
      var rows = feed ? feed.querySelectorAll('.feed-row') : [];
      if (!rows.length) fail('no feed row was rendered at ' + width + 'px');
      var sayRow = feed.querySelector('.pm-say');
      if (sayRow) sayRow = sayRow.parentNode;
      if (!sayRow) {
        var seen = [];
        for (var i = 0; i < rows.length; i++) seen.push(rows[i].className);
        fail('the seat line never reached the feed at ' + width +
          'px (rows: ' + seen.join(' | ') + ')');
      }
      var box = sayRow.getBoundingClientRect();
      if (box.width < 20 || box.height < 6) {
        fail('the seat line laid out as a sliver at ' + width + 'px: ' +
          Math.round(box.width) + 'x' + Math.round(box.height));
      }
      if (box.top < -1 || box.left < -1) {
        fail('the seat line was laid out off-frame at ' + width + 'px');
      }
      // ...and the row still carries the WHOLE remark. A box of the right size
      // holding a shortened sentence is the failure this catches: DOM ellipsis
      // is visual, so textContent is still the full string unless something on
      // the path cut it.
      var sayText = sayRow.textContent || '';
      if (sayText.indexOf(CAP_SAY) < 0) {
        var quoteAt = sayText.indexOf('\u201c');
        var shown = quoteAt >= 0
          ? sayText.slice(quoteAt + 1, sayText.lastIndexOf('\u201d'))
          : sayText;
        fail('the rendered seat line is not the full-cap string at ' +
          width + 'px: ' + Array.from(shown).length + ' of ' + CAP_SAY_RUNES +
          ' runes reached the feed');
      }
      var name = doc.getElementById('pname-0');
      if (name) {
        var nameBox = name.getBoundingClientRect();
        var text = (name.textContent || '').trim();
        if (!text.length) fail('the plate name is empty at ' + width + 'px');
        if (nameBox.width < 18) {
          fail('the plate name collapsed to ' + Math.round(nameBox.width) +
            'px at ' + width + 'px -- .plate-name needs min-width');
        }
      }
      checks.push(width + 'px: feed ' + Math.round(box.width) + 'x' +
        Math.round(box.height) + ', name ' +
        (name ? Math.round(name.getBoundingClientRect().width) : 0) + 'px');
      // The same worst-case frame through the REAL board renderer, on a canvas
      // this document owns, at this width.
      var textDraws = driveCanvas(base, width);
      checks[checks.length - 1] += ', canvas ' + textDraws + ' text draws';
      driveWidth(index + 1, done);
    }, 400);
  }

  // Everything the canvas half must be able to say when it is done. A fixture
  // that reports zero drawn strings has tested nothing, which is exactly the
  // state the --strict-text-bounds gate was in while the board lived in a
  // Worker: `canvas_text: {total: 0}`.
  function assertCanvasTextIsReal() {
    if (drawn.total < 1) {
      fail('no canvas text was measured at any width -- the --strict-text-' +
        'bounds gate would be vacuous');
    }
    var sawFuse = false;
    var sawRadio = false;
    for (var text in drawn.strings) {
      if (!Object.prototype.hasOwnProperty.call(drawn.strings, text)) continue;
      if (/^[0-9]$/.test(text)) sawFuse = true;
      if (text.indexOf('\u224b') === 0) sawRadio = true;
    }
    if (!sawFuse) fail('the renderer drew no bomb fuse numeral');
    if (!sawRadio) fail('the renderer drew no radio pair badge');
    // The fixture renders ONE settled worst-case frame per width -- there is no
    // entrance animation here to be legitimately off-frame for a few frames --
    // so ANY draw that crossed an edge is the defect, which is stricter than
    // the harness's never_inside and is the fixture's own gate.
    if (drawn.outside > 0) {
      var crossed = [];
      for (var key in drawn.strings) {
        if (!Object.prototype.hasOwnProperty.call(drawn.strings, key)) continue;
        if (drawn.strings[key].outside > 0) {
          crossed.push(JSON.stringify(key) + ' ' + drawn.strings[key].edges +
            ' [' + (drawn.strings[key].box || []).join(',') + '] in ' +
            (drawn.strings[key].canvas || []).join('x'));
        }
      }
      fail(drawn.outside + ' canvas text draw(s) crossed the board edge: ' +
        crossed.slice(0, 4).join(' | '));
    }
    var never = neverInside();
    if (never.length) {
      var shown = never.slice(0, 4).map(function (n) {
        return JSON.stringify(n.text) + ' ' + n.edges + ' [' +
          (n.box || []).join(',') + '] in ' + (n.canvas || []).join('x');
      }).join(' | ');
      fail(never.length + ' string(s) were drawn OUTSIDE the board canvas on ' +
        'every draw and never once inside: ' + shown);
    }
  }

  function poll() {
    if (ready()) {
      driveWidth(0, function () {
        assertCanvasTextIsReal();
        publishMergedBounds();
        boardNote.textContent = 'canvas: ' + drawn.total + ' text draws, ' +
          neverInside().length + ' never inside';
        report.textContent = 'fixture ok - ' + checks.join(' | ');
        document.documentElement.setAttribute('data-replay-loaded', 'true');
      });
      return;
    }
    try {
      var error = iframe.contentDocument &&
        iframe.contentDocument.documentElement.getAttribute('data-replay-error');
      if (error) fail('the shipped page failed: ' + error);
    } catch (ignored) { /* cross-document timing */ }
    if (Date.now() > deadline) {
      fail('the shipped page never set data-replay-loaded');
    }
    setTimeout(poll, 250);
  }
  poll();
})();
</script>
</body>
</html>
